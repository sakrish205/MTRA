# MTRA parameter catalogue — PRD §7, 112 parameters in 12 groups.
#
# This is what the report must account for: every id appears in every run, with a
# value or with a reason code. `phase` records which phase is expected to compute
# it — anything not phase 1 is reported as `out_of_phase_scope` with its PRD
# group, which keeps the gap visible instead of letting it vanish.
#
# `requires` names the inputs a measurement needs. The measurement layer uses it
# to choose between "cannot measure" reason codes rather than emitting a bare
# blank.

version: 1
groups:
  A: "Coordinate alignment and correspondence"
  B: "Path direction vs mesh geometry"
  C: "Path spacing vs mesh geometry"
  D: "Stroke shape vs mesh geometry"
  E: "Mesh surface characteristics vs trajectory"
  F: "Path pattern and generation method"
  G: "Surface adaptation and transformation"
  H: "Boundary and region relationships"
  I: "Tool orientation and standoff vs mesh"
  J: "Path continuity and sequencing"
  K: "Robot trajectory representation"
  L: "Reverse-engineering and mathematical rule discovery"

parameters:
  - {id: A1, group: A, name: "Coordinate transformation", unit: "4x4 matrix", phase: 1}
  - {id: A2, group: A, name: "Registration error", unit: "mm", phase: 1}
  - {id: A3, group: A, name: "TCP-to-surface distance", unit: "mm", phase: 1}
  - {id: A4, group: A, name: "Spray-axis intersection", unit: "point", phase: 1}
